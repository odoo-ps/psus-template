repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort-init
        args: ['--sl']
        files: \b__init__\.py$
      - id: isort
        name: isort-python
        files: \.py$
        exclude: \b__init__\.py$
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-logging-format
          - flake8-implicit-str-concat
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    - id: check-xml
    - id: check-yaml
    - id: check-toml
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-symlinks
    - id: debug-statements
    - id: fix-encoding-pragma
      args: ['--remove']
    - id: no-commit-to-branch
      args: [--branch, main, --branch, master, --branch, production,
             --branch, live, --branch, sandbox, --pattern, '.*staging.*']
  # Secret scanning — blocks hardcoded credentials/keys/tokens from being committed.
  # Reads .gitleaks.toml at the repo root for the synthetic-placeholder allowlist.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
